<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srcset and Sizes Attributes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <img src="image300X300.webp" 
    srcset="image300X300.webp 300w,image600X600.jpg 500w, image900X900.jpg 900w" 
    sizes="(max-width: 600px) 500px, 900px"
    >
</body>
</html>
